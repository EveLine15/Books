<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookTracker</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
    <link rel="stylesheet" href="/src/styles/catalog.css" />
    <link rel="stylesheet" href="/src/styles/favorites.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-container">
        <a href="#catalog" class="logo">
          <img src="./src/assets/books-icon.svg" alt="icon" />
          BookTracker
        </a>

        <div class="header-actions">
          <button
            class="theme-toggle-btn"
            id="theme-toggle-btn"
            aria-label="Переключить тему"
          >
            <svg
              class="theme-icon moon-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg
              class="theme-icon sun-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          </button>
          <button
            class="burger-btn"
            id="burger-btn"
            aria-label="Открыть меню"
            aria-expanded="false"
          >
            <span class="burger-line"></span>
            <span class="burger-line"></span>
            <span class="burger-line"></span>
          </button>

          <nav class="nav-links" id="nav-links">
            <a href="#catalog" class="nav-link" data-route="catalog">Каталог</a>
            <a href="#favorites" class="nav-link" data-route="favorites"
              >Избранное</a
            >
          </nav>
        </div>
      </div>
    </header>

    <main id="outlet" class="app-main"></main>

    <footer class="app-footer">
      <p>&copy; 2026 BookTracker. Все права защищены.</p>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
